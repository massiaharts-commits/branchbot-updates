        } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            prevSlide();
        }
    };
    
    // Checklist interaction handler - works for both standalone and synced checklists
    document.addEventListener('change', function(e) {
        if (e.target.type === 'checkbox' && e.target.closest('.checklist-wrapper')) {
            var wrapper = e.target.closest('.checklist-wrapper');
            var nodeId = wrapper.getAttribute('data-node-id');
            var idx = parseInt(e.target.getAttribute('data-idx'));
            var isChecked = e.target.checked;
            var isSynced = wrapper.classList.contains('synced');
            
            var label = e.target.closest('.checklist-item');
            if (isChecked) {
                label.classList.add('checked');
            } else {
                label.classList.remove('checked');
            }
            
            // If synced with sidebar, update sidebar state
            if (isSynced && checklistSidebarItems && checklistSidebarItems.length > 0) {
                var sidebarIdx = parseInt(label.getAttribute('data-sidebar-idx'));
                
                if (sidebarIdx >= 0 && checklistSidebarItems[sidebarIdx]) {
                    checklistSidebarItems[sidebarIdx].checked = isChecked;
                    
                    // Update sidebar visual
                    var sidebarEl = document.querySelector('.sidebar-checklist-item[data-idx="' + sidebarIdx + '"]');
                    if (sidebarEl) {
                        if (isChecked) {
                            sidebarEl.classList.add('checked');
                            sidebarEl.querySelector('.checkmark').textContent = '✓';
                        } else {
                            sidebarEl.classList.remove('checked');
                            sidebarEl.querySelector('.checkmark').textContent = '';
                        }
                    }
                    
                    // Save to localStorage
                    saveChecklistSidebarState();
                    
                    // Update progress bar in sidebar
                    updateChecklistSidebarProgress();
                    
                    // Check for completion
                    checkForCompletion();
                }
            } else {
                // Standalone checklist - save to node-specific storage
                var storageKey = 'checklist-' + nodeId;
                var savedState = {};
                try {
                    var saved = localStorage.getItem(storageKey);
                    if (saved) savedState = JSON.parse(saved);
                } catch (err) {}
                
                savedState[idx] = isChecked;
                localStorage.setItem(storageKey, JSON.stringify(savedState));
            }
            
            // Update progress bar in the slide
            var items = wrapper.querySelectorAll('.checklist-item');
            var total = items.length;
            var checked = wrapper.querySelectorAll('.checklist-item.checked').length;
            var percentage = total > 0 ? Math.round((checked / total) * 100) : 0;
            
            var progressFill = wrapper.querySelector('.checklist-progress-fill');
            var progressText = wrapper.querySelector('.checklist-progress-text');
            
            if (progressFill) progressFill.style.width = percentage + '%';
            if (progressText) progressText.textContent = percentage + '% (' + checked + '/' + total + ')';
        }
    });
    
    // ========== CHECKLIST SIDEBAR (TABBED) ==========
    var checklistSidebarItems = [];
    var checklistStorageKey = 'presentation-checklist-' + document.title;
    
    function initChecklistSidebar() {
        var listNodes = nodes.filter(function(n) {
            var types = Array.isArray(n.node_type) ? n.node_type : [n.node_type];
            return types.indexOf('list') >= 0;
        });
        
        // Hide checklist tab and progress if no list nodes
        if (listNodes.length === 0) {
            var checklistTab = document.getElementById('checklistTab');
            var progressHeader = document.getElementById('sidebarProgressHeader');
            if (checklistTab) checklistTab.classList.add('hidden');
            if (progressHeader) progressHeader.classList.add('hidden');
            return;
        }
        
        listNodes.sort(function(a, b) { return a.id - b.id; });
        checklistSidebarItems = parseAllListNodes(listNodes);
        loadChecklistSidebarState();
        renderChecklistSidebar();
        updateChecklistSidebarProgress();
        setupSidebarTabs();
    }
    
    function setupSidebarTabs() {
        var tabs = document.querySelectorAll('.sidebar-tab');
        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                var tabName = this.getAttribute('data-tab');
                
                // Update active tab
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                
                // Show correct content
                document.getElementById('slidesTabContent').classList.toggle('hidden', tabName !== 'slides');
                document.getElementById('checklistTabContent').classList.toggle('hidden', tabName !== 'checklist');
            });
        });
    }
    
    function parseAllListNodes(listNodes) {
        var allItems = [];
        
        listNodes.forEach(function(listNode, listIndex) {
            var items = parseChecklistWithLinks(listNode.content, listNode.id);
            
            if (items.length > 0) {
                allItems.push({
                    type: 'section',
                    title: listNode.title || 'Checklist ' + (listIndex + 1),
                    nodeId: listNode.id
                });
                
                items.forEach(function(item) {
                    allItems.push(item);
                });
            }
        });
        
        return allItems;
    }
    
    function parseChecklistWithLinks(content, listNodeId) {
        if (!content) return [];
        var items = [];
        var lines = content.split('\n');
        
        lines.forEach(function(line, lineIndex) {
            var match = line.match(/^(\s*)-\s*\[([ xX])\]\s*(.+)$/);
            if (!match) return;
            
            var text = match[3].trim();
            var checked = match[2].toLowerCase() === 'x';
            
            var dueMatch = text.match(/@due:(\d{4}-\d{2}-\d{2})/);
            var dueDate = dueMatch ? dueMatch[1] : null;
            if (dueDate) text = text.replace(/@due:\d{4}-\d{2}-\d{2}/, '').trim();
            
            var slideMatch = text.match(/#(\d+)\s*$/);
            var slideNum = slideMatch ? parseInt(slideMatch[1]) : null;
            if (slideNum) text = text.replace(/#\d+\s*$/, '').trim();
            
            var nodeMatch = text.match(/@Node #(\d+)/);
            var linkedNodeId = nodeMatch ? parseInt(nodeMatch[1]) : null;
            
            var linkTarget = null;
            if (linkedNodeId) {
                for (var i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === linkedNodeId) {
                        linkTarget = { type: 'node', nodeId: linkedNodeId };
                        break;
                    }
                }
            } else if (slideNum && slideNum > 0 && slideNum <= nodes.length) {
                var targetNode = nodes[slideNum - 1];
                linkTarget = { 
                    type: 'slide', 
                    slideNum: slideNum,
                    nodeId: targetNode ? targetNode.id : null
                };
            }
            
            items.push({
                type: 'item',
                text: text,
                checked: checked,
                dueDate: dueDate,
                linkTarget: linkTarget,
                listNodeId: listNodeId,
                lineIndex: lineIndex
            });
        });
        
        return items;
    }
    
    function renderChecklistSidebar() {
        var container = document.getElementById('checklistSidebarContent');
        if (!container) return;
        
        var html = '';
        
        checklistSidebarItems.forEach(function(item, idx) {
            if (item.type === 'section') {
                html += '<div class="checklist-section-label">From: ' + escapeHtml(item.title) + '</div>';
            } else {
                var checkedClass = item.checked ? ' checked' : '';
                var checkmark = item.checked ? '✓' : '';
                
                var linkHtml = '';
                if (item.linkTarget) {
                    var linkText = item.linkTarget.type === 'slide' 
                        ? '→#' + item.linkTarget.slideNum 
                        : '→Node';
                    linkHtml = '<span class="sidebar-item-link" data-link-idx="' + idx + '">' + linkText + '</span>';
                }
                
                var dueHtml = '';
                if (item.dueDate) {
                    var due = formatDueDate(item.dueDate);
                    dueHtml = '<span class="checklist-due ' + due.className + '">' + due.text + '</span>';
                }
                
                var hasLink = item.linkTarget ? 'true' : 'false';
                html += '<div class="sidebar-checklist-item' + checkedClass + '" data-idx="' + idx + '" data-has-link="' + hasLink + '">';
                html += '<span class="checkmark">' + checkmark + '</span>';
                html += '<span class="sidebar-item-text" title="' + escapeHtml(item.text) + '">' + escapeHtml(item.text) + '</span>';
                html += dueHtml;
                html += linkHtml;
                html += '</div>';
            }
        });
        
        container.innerHTML = html;
        attachChecklistSidebarListeners();
    }
    
    function attachChecklistSidebarListeners() {
        var container = document.getElementById('checklistSidebarContent');
        if (!container) return;
        
        container.querySelectorAll('.sidebar-checklist-item').forEach(function(el) {
            var idx = parseInt(el.getAttribute('data-idx'));
            var item = checklistSidebarItems[idx];
            
            if (!item || item.type === 'section') return;
            
            if (item.linkTarget) {
                // HAS link - read-only, click navigates to slide
                el.style.cursor = 'pointer';
                el.title = 'Click to go to slide and mark complete';
                
                el.addEventListener('click', function(e) {
                    if (e.target.classList.contains('sidebar-item-link')) {
                        navigateToLinkedSlide(idx);
                        return;
                    }
                    // Click anywhere navigates to the linked slide
                    navigateToLinkedSlide(idx);
                });
            } else {
                // NO link - can check directly in sidebar
                el.style.cursor = 'pointer';
                el.title = 'Click to mark complete';
                
                el.addEventListener('click', function(e) {
                    toggleChecklistSidebarItem(idx);
                });
            }
        });
        // Check if all items completed
        checkForCompletion();
    }
    
    function toggleChecklistSidebarItem(idx) {
        var item = checklistSidebarItems[idx];
        if (!item || item.type === 'section') return;
        
        item.checked = !item.checked;
        
        var el = document.querySelector('.sidebar-checklist-item[data-idx="' + idx + '"]');
        if (el) {
            if (item.checked) {
                el.classList.add('checked');
                el.querySelector('.checkmark').textContent = '✓';
            } else {
                el.classList.remove('checked');
                el.querySelector('.checkmark').textContent = '';
            }
        }
        
        saveChecklistSidebarState();
        updateChecklistSidebarProgress();
    }
    
    function navigateToLinkedSlide(idx) {
        var item = checklistSidebarItems[idx];
        if (!item || !item.linkTarget) return;
        
        var targetNodeId = item.linkTarget.nodeId;
        if (!targetNodeId) return;
        
        for (var i = 0; i < currentOrder.length; i++) {
            var nodeIndex = currentOrder[i];
            if (nodes[nodeIndex].id === targetNodeId) {
                if (hiddenSlides[nodeIndex]) {
                    delete hiddenSlides[nodeIndex];
                    buildSidebar();
                }
                showSlide(i);
                closeSidebar();
                return;
            }
        }
    }
    function updateMarkCompleteButton(nodeIndex) {
        if (!els.markCompleteBtn) return;
        
        // Check if checklist sidebar is initialized
        if (!checklistSidebarItems || checklistSidebarItems.length === 0) {
            els.markCompleteBtn.classList.add('hidden');
            return;
        }
        
        var node = nodes[nodeIndex];
        if (!node) {
            els.markCompleteBtn.classList.add('hidden');
            return;
        }
        
        // Find checklist item linked to this slide/node
        var linkedItemIdx = findLinkedChecklistItem(node.id, nodeIndex);
        
        if (linkedItemIdx === -1) {
            els.markCompleteBtn.classList.add('hidden');
            return;
        }
        
        var item = checklistSidebarItems[linkedItemIdx];
        els.markCompleteBtn.classList.remove('hidden');
        els.markCompleteBtn.dataset.itemIdx = linkedItemIdx;
        
        if (item.checked) {
            els.markCompleteBtn.innerHTML = '✓ Completed';
            els.markCompleteBtn.classList.add('completed');
        } else {
            els.markCompleteBtn.innerHTML = '☐ Mark Complete';
            els.markCompleteBtn.classList.remove('completed');
        }
    }
    
    function findLinkedChecklistItem(nodeId, nodeIndex) {
        for (var i = 0; i < checklistSidebarItems.length; i++) {
            var item = checklistSidebarItems[i];
            if (item.type !== 'item' || !item.linkTarget) continue;
            
            // Check if linked by node ID (@Node #ID)
            if (item.linkTarget.nodeId === nodeId) {
                return i;
            }
            
            // Check if linked by slide number (#N)
            if (item.linkTarget.type === 'slide') {
                var slideNum = item.linkTarget.slideNum;
                // slideNum is 1-indexed, nodeIndex is 0-indexed
                if (slideNum - 1 === nodeIndex) {
                    return i;
                }
            }
        }
        return -1;
    }
    
    function handleMarkComplete() {
        var idx = parseInt(els.markCompleteBtn.dataset.itemIdx);
        if (isNaN(idx)) return;
        
        var item = checklistSidebarItems[idx];
        if (!item || item.type === 'section') return;
        
        // Toggle state
        item.checked = !item.checked;
        
        // Update sidebar visual
        var el = document.querySelector('.sidebar-checklist-item[data-idx="' + idx + '"]');
        if (el) {
            if (item.checked) {
                el.classList.add('checked');
                el.querySelector('.checkmark').textContent = '✓';
            } else {
                el.classList.remove('checked');
                el.querySelector('.checkmark').textContent = '';
            }
            // Check if all items completed
            checkForCompletion();
        }
        
        // Save state
        saveChecklistSidebarState();
        
        // Update progress
        updateChecklistSidebarProgress();
        
        // Update button state
        if (item.checked) {
            els.markCompleteBtn.innerHTML = '✓ Completed';
            els.markCompleteBtn.classList.add('completed');
        } else {
            els.markCompleteBtn.innerHTML = '☐ Mark Complete';
            els.markCompleteBtn.classList.remove('completed');
        }
        
        // Refresh the current slide if it's a list node (to sync the in-slide checklist)
        var currentNodeIndex = currentOrder[currentIndex];
        var currentNode = nodes[currentNodeIndex];
        var currentTypes = Array.isArray(currentNode.node_type) ? currentNode.node_type : [currentNode.node_type];
        if (currentTypes.indexOf('list') >= 0) {
            els.cardContent.innerHTML = renderChecklistSynced(currentNode);
        }
        
        // Open sidebar only when marking complete (not when unmarking)
        if (item.checked) {
            els.sidebar.classList.add('open');
            els.overlay.classList.add('open');
            
            // Switch to checklist tab
            var tabs = document.querySelectorAll('.sidebar-tab');
            tabs.forEach(function(t) { t.classList.remove('active'); });
            var checklistTab = document.getElementById('checklistTab');
            if (checklistTab) checklistTab.classList.add('active');
            
            document.getElementById('slidesTabContent').classList.add('hidden');
            document.getElementById('checklistTabContent').classList.remove('hidden');
        }
    }
    // ========== COMPLETION SYSTEM ==========
    function checkForCompletion() {
        if (hasShownCompletion) return;
        
        var items = checklistSidebarItems.filter(function(i) { return i.type === 'item'; });
        var total = items.length;
        var checked = items.filter(function(i) { return i.checked; }).length;
        
        if (total > 0 && checked === total) {
            hasShownCompletion = true;
            showCompletionModal();
        }
    }
    
    function showCompletionModal() {
        var items = checklistSidebarItems.filter(function(i) { return i.type === 'item'; });
        var total = items.length;
        
        // Update stats
        els.completedCount.textContent = total + '/' + total;
        els.timeSpent.textContent = formatTimeSpent();
        
        // Show modal
        els.completionOverlay.classList.remove('hidden');
        els.completionModal.classList.remove('hidden');
        
        setTimeout(function() {
            els.completionOverlay.classList.add('visible');
            els.completionModal.classList.add('visible');
        }, 10);
        
        // Trigger confetti
        createConfetti();
    }
    
    function hideCompletionModal() {
        els.completionOverlay.classList.remove('visible');
        els.completionModal.classList.remove('visible');
        
        setTimeout(function() {
            els.completionOverlay.classList.add('hidden');
            els.completionModal.classList.add('hidden');
        }, 300);
    }
    
    function formatTimeSpent() {
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var hours = Math.floor(elapsed / 3600);
        var minutes = Math.floor((elapsed % 3600) / 60);
        
        if (hours > 0) {
            return hours + 'h ' + minutes + 'm';
        } else if (minutes > 0) {
            return minutes + ' min';
        } else {
            return '< 1 min';
        }
    }
    
    function createConfetti() {
        var colors = ['#22c55e', '#f59e0b', '#3b82f6', '#ef4444', '#a855f7', '#ec4899'];
        var container = els.confettiContainer;
        container.innerHTML = '';
        
        for (var i = 0; i < 50; i++) {
            var piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDelay = Math.random() * 0.5 + 's';
            piece.style.animationDuration = (2 + Math.random() * 2) + 's';
            
            var size = 5 + Math.random() * 10;
            piece.style.width = size + 'px';
            piece.style.height = size + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            
            container.appendChild(piece);
        }
        
        // Clear confetti after animation
        setTimeout(function() {
            container.innerHTML = '';
        }, 4000);
    }
    
    function generateCompletionReport() {
        var reviewerName = els.reviewerName.value.trim() || '______________________';
        var items = checklistSidebarItems.filter(function(i) { return i.type === 'item'; });
        var total = items.length;
        var checked = items.filter(function(i) { return i.checked; }).length;
        var presentationTitle = document.title || 'Presentation';
        var completionDate = new Date().toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        var itemsHtml = '';
        checklistSidebarItems.forEach(function(item) {
            if (item.type === 'section') {
                itemsHtml += '<tr class="section-row"><td colspan="2"><strong>' + escapeHtml(item.title) + '</strong></td></tr>';
            } else {
                var status = item.checked ? '✓' : '☐';
                var statusClass = item.checked ? 'checked' : 'unchecked';
                itemsHtml += '<tr class="item-row ' + statusClass + '">';
                itemsHtml += '<td class="status">' + status + '</td>';
                itemsHtml += '<td>' + escapeHtml(item.text) + '</td>';
                itemsHtml += '</tr>';
            }
        });
        
        var reportHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">';
        reportHtml += '<title>Completion Report - ' + escapeHtml(presentationTitle) + '</title>';
        reportHtml += '<style>';
        reportHtml += 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; color: #1f2328; }';
        reportHtml += '.header { border-bottom: 3px solid #22c55e; padding-bottom: 1rem; margin-bottom: 2rem; }';
        reportHtml += '.header h1 { margin: 0 0 0.5rem 0; color: #22c55e; font-size: 1.5rem; }';
        reportHtml += '.header h2 { margin: 0; font-weight: normal; color: #656d76; font-size: 1rem; }';
        reportHtml += '.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: #f6f8fa; border-radius: 8px; }';
        reportHtml += '.meta-item label { display: block; font-size: 0.75rem; color: #656d76; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }';
        reportHtml += '.meta-item span { font-size: 1rem; font-weight: 600; }';
        reportHtml += '.summary { text-align: center; padding: 1.5rem; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border-radius: 8px; margin-bottom: 2rem; }';
        reportHtml += '.summary .percent { font-size: 3rem; font-weight: 700; }';
        reportHtml += '.summary .label { font-size: 0.875rem; opacity: 0.9; }';
        reportHtml += 'table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }';
        reportHtml += '.section-row td { padding: 1rem 0.5rem 0.5rem 0.5rem; border-bottom: 1px solid #d0d7de; color: #656d76; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }';
        reportHtml += '.item-row td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #f0f0f0; }';
        reportHtml += '.item-row .status { width: 30px; font-size: 1.25rem; }';
        reportHtml += '.item-row.checked .status { color: #22c55e; }';
        reportHtml += '.item-row.unchecked .status { color: #d0d7de; }';
        reportHtml += '.item-row.unchecked td { color: #656d76; }';
        reportHtml += '.signature { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #d0d7de; }';
        reportHtml += '.signature-line { display: flex; gap: 2rem; margin-bottom: 1rem; }';
        reportHtml += '.signature-field { flex: 1; }';
        reportHtml += '.signature-field label { display: block; font-size: 0.75rem; color: #656d76; margin-bottom: 0.5rem; }';
        reportHtml += '.signature-field .line { border-bottom: 1px solid #1f2328; min-height: 2rem; }';
        reportHtml += '.footer { margin-top: 3rem; text-align: center; font-size: 0.75rem; color: #656d76; }';
        reportHtml += '@media print { body { padding: 0; } .summary { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
        reportHtml += '</style></head><body>';
        
        reportHtml += '<div class="header">';
        reportHtml += '<h1>📋 Review Completion Report</h1>';
        reportHtml += '<h2>' + escapeHtml(presentationTitle) + '</h2>';
        reportHtml += '</div>';
        
        reportHtml += '<div class="meta">';
        reportHtml += '<div class="meta-item"><label>Reviewer</label><span>' + escapeHtml(reviewerName) + '</span></div>';
        reportHtml += '<div class="meta-item"><label>Completion Date</label><span>' + completionDate + '</span></div>';
        reportHtml += '<div class="meta-item"><label>Time Spent</label><span>' + formatTimeSpent() + '</span></div>';
        reportHtml += '<div class="meta-item"><label>Items Reviewed</label><span>' + checked + ' of ' + total + '</span></div>';
        reportHtml += '</div>';
        
        var percentage = total > 0 ? Math.round((checked / total) * 100) : 0;
        reportHtml += '<div class="summary">';
        reportHtml += '<div class="percent">' + percentage + '%</div>';
        reportHtml += '<div class="label">Complete</div>';
        reportHtml += '</div>';
        
        reportHtml += '<table>' + itemsHtml + '</table>';
        
        reportHtml += '<div class="signature">';
        reportHtml += '<div class="signature-line">';
        reportHtml += '<div class="signature-field"><label>Signature</label><div class="line"></div></div>';
        reportHtml += '<div class="signature-field"><label>Date</label><div class="line"></div></div>';
        reportHtml += '</div>';
        reportHtml += '</div>';
        
        reportHtml += '<div class="footer">Generated by Branch Bot — Visual Knowledge Management</div>';
        reportHtml += '</body></html>';
        
        // Open in new window for printing
        var reportWindow = window.open('', '_blank');
        reportWindow.document.write(reportHtml);
        reportWindow.document.close();
        reportWindow.focus();
        
        setTimeout(function() {
            reportWindow.print();
        }, 250);
    }
    
    function exportProgress() {
        var items = checklistSidebarItems.filter(function(i) { return i.type === 'item'; });
        var progressData = {
            version: 1,
            presentation: document.title,
            exportDate: new Date().toISOString(),
            timeSpent: Date.now() - startTime,
            reviewerName: els.reviewerName.value.trim(),
            items: {}
        };
        
        checklistSidebarItems.forEach(function(item, idx) {
            if (item.type === 'item') {
                progressData.items[idx] = item.checked;
            }
        });
        
        var dataStr = JSON.stringify(progressData, null, 2);
        var blob = new Blob([dataStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        
        var a = document.createElement('a');
        a.href = url;
        a.download = 'progress-' + document.title.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    
    function importProgress(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                
                if (data.items) {
                    checklistSidebarItems.forEach(function(item, idx) {
                        if (item.type === 'item' && data.items[idx] !== undefined) {
                            item.checked = data.items[idx];
                        }
                    });
                    
                    saveChecklistSidebarState();
                    renderChecklistSidebar();
                    updateChecklistSidebarProgress();
                    
                    if (data.reviewerName) {
                        els.reviewerName.value = data.reviewerName;
                    }
                    
                    if (data.timeSpent) {
                        startTime = Date.now() - data.timeSpent;
                    }
                    
                    // Refresh current slide
                    showSlide(currentIndex);
                    
                    alert('Progress imported successfully!');
                }
            } catch (err) {
                alert('Error importing progress: Invalid file format');
            }
        };
        reader.readAsText(file);
    }
    // ========== END COMPLETION SYSTEM ==========
    function updateChecklistSidebarProgress() {
        var items = checklistSidebarItems.filter(function(i) { return i.type === 'item'; });
        var total = items.length;
        var checked = items.filter(function(i) { return i.checked; }).length;
        var percentage = total > 0 ? Math.round((checked / total) * 100) : 0;
        
        var fill = document.getElementById('sidebarProgressFill');
        var text = document.getElementById('sidebarProgressText');
        
        if (fill) fill.style.width = percentage + '%';
        if (text) text.textContent = percentage + '% (' + checked + '/' + total + ')';
    }
    
    function loadChecklistSidebarState() {
        try {
            var saved = localStorage.getItem(checklistStorageKey);
            if (saved) {
                var state = JSON.parse(saved);
                checklistSidebarItems.forEach(function(item, idx) {
                    if (item.type === 'item' && state[idx] !== undefined) {
                        item.checked = state[idx];
                    }
                });
            }
        } catch (e) {}
    }
    
    function saveChecklistSidebarState() {
        try {
            var state = {};
            checklistSidebarItems.forEach(function(item, idx) {
                if (item.type === 'item') {
                    state[idx] = item.checked;
                }
            });
            localStorage.setItem(checklistStorageKey, JSON.stringify(state));
        } catch (e) {}
    }
    // ========== END CHECKLIST SIDEBAR ==========

    // ===== ANIMATION SYSTEM =====
    
    function initAnimationSettings() {
        // Set initial values from config
        var fadeSelect = document.getElementById('settingsFade');
        var twSelect = document.getElementById('settingsTypewriter');
        
        if (fadeSelect) fadeSelect.value = currentFadeSpeed;
        if (twSelect) twSelect.value = currentTypewriterSpeed;
        
        // Settings button toggle
        var settingsBtn = document.getElementById('settingsBtn');
        var settingsPanel = document.getElementById('settingsPanel');
        
        if (settingsBtn && settingsPanel) {
            settingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                settingsPanel.classList.toggle('open');
            });
            
            // Close on outside click
            document.addEventListener('click', function(e) {
                if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                    settingsPanel.classList.remove('open');
                }
            });
        }
        
        // Listen for setting changes
        if (fadeSelect) {
            fadeSelect.addEventListener('change', function() {
                currentFadeSpeed = this.value;
                saveAnimationSettings();
            });
        }
        
        if (twSelect) {
            twSelect.addEventListener('change', function() {
                currentTypewriterSpeed = this.value;
                saveAnimationSettings();
            });
        }
        
        // Load saved settings
        loadAnimationSettings();
        
        // Click to skip animation
        document.addEventListener('click', function(e) {
            if (isAnimating && !e.target.closest('.sidebar') && !e.target.closest('.settings-panel') && !e.target.closest('button')) {
                skipAnimation();
            }
        });
    }
    
    function saveAnimationSettings() {
        try {
            localStorage.setItem('presentation-animation', JSON.stringify({
                fade: currentFadeSpeed,
                typewriter: currentTypewriterSpeed,
                disabledSlides: animationDisabledSlides
            }));
        } catch (e) {}
    }
    
    function loadAnimationSettings() {
        try {
            var saved = localStorage.getItem('presentation-animation');
            if (saved) {
                var settings = JSON.parse(saved);
                currentFadeSpeed = settings.fade || ANIMATION_CONFIG.fadeSpeed;
                currentTypewriterSpeed = settings.typewriter || ANIMATION_CONFIG.typewriterSpeed;
                animationDisabledSlides = settings.disabledSlides || {};
                
                var fadeSelect = document.getElementById('settingsFade');
                var twSelect = document.getElementById('settingsTypewriter');
                if (fadeSelect) fadeSelect.value = currentFadeSpeed;
                if (twSelect) twSelect.value = currentTypewriterSpeed;
            }
        } catch (e) {}
    }
    
    function skipAnimation() {
        if (!isAnimating) return;
        
        // Clear typewriter timeout
        if (typewriterTimeout) {
            clearTimeout(typewriterTimeout);
            typewriterTimeout = null;
        }
        
        // Show all content immediately
        var content = document.getElementById('cardContent');
        if (content) {
            var contentDiv = content.querySelector('.typewriter-content');
            if (contentDiv && contentDiv.dataset.fullHtml) {
                content.innerHTML = contentDiv.dataset.fullHtml;
            }
        }
        
        isAnimating = false;
    }
    
    function runFadeAnimation(card) {
        var duration = ANIMATION_CONFIG.fadeDurations[currentFadeSpeed] || 0;
        
        if (duration === 0) return;
        
        card.style.setProperty('--fade-duration', duration + 'ms');
        card.classList.remove('animate-fade');
        
        // Force reflow
        void card.offsetWidth;
        
        card.classList.add('animate-fade');
    }
    
    function runTypewriterEffect(contentEl, html) {
        var speed = ANIMATION_CONFIG.typewriterSpeeds[currentTypewriterSpeed] || 0;
        
        if (speed === 0) {
            contentEl.innerHTML = html;
            return;
        }
        
        isAnimating = true;
        
        // Split content by line breaks and paragraphs
        var chunks = html
            .replace(/(<br\s*\/?>)/gi, '$1|||SPLIT|||')
            .replace(/(<\/p>)/gi, '$1|||SPLIT|||')
            .replace(/(<\/div>)/gi, '$1|||SPLIT|||')
            .replace(/(<\/li>)/gi, '$1|||SPLIT|||')
            .replace(/(<\/h[1-6]>)/gi, '$1|||SPLIT|||')
            .split('|||SPLIT|||')
            .filter(function(chunk) { return chunk.trim().length > 0; });
        
        // If we couldn't split, just fade the whole thing
        if (chunks.length <= 1) {
            contentEl.innerHTML = '<div style="animation: fadeInContent ' + (speed * 20) + 'ms ease-out forwards;">' + html + '</div>';
            setTimeout(function() {
                contentEl.innerHTML = html;
                isAnimating = false;
            }, speed * 20);
            return;
        }
        
        // Create container
        contentEl.innerHTML = '<div class="typewriter-container typing">' +
            '<div class="typewriter-content"></div>' +
            '<div class="typewriter-skip-hint">Click to skip</div>' +
            '</div>';
        
        var contentDiv = contentEl.querySelector('.typewriter-content');
        contentDiv.dataset.fullHtml = html;
        
        var currentIndex = 0;
        var delayPerChunk = Math.max(50, speed * 3);
        
        function showNextChunk() {
            if (currentIndex >= chunks.length || !isAnimating) {
                contentEl.innerHTML = html;
                isAnimating = false;
                return;
            }
            
            // Build HTML up to current chunk
            var visibleHtml = '';
            for (var i = 0; i <= currentIndex; i++) {
                visibleHtml += chunks[i];
            }
            contentDiv.innerHTML = visibleHtml;
            
            currentIndex++;
            typewriterTimeout = setTimeout(showNextChunk, delayPerChunk);
        }
        
        showNextChunk();
    }
    
    function runBlockReveal(contentEl, html, speed) {
        // Split by paragraphs/blocks
        var blocks = html.split(/(<\/?(p|div|br|h[1-6]|li|tr)[^>]*>)/gi).filter(function(b) { 
            return b && b.trim(); 
        });
        
        // Group back together
        var displayBlocks = [];
        var current = '';
        
        for (var i = 0; i < blocks.length; i++) {
            current += blocks[i];
            if (/<\/(p|div|h[1-6]|li|tr)>/i.test(blocks[i]) || /<br\s*\/?>/i.test(blocks[i])) {
                displayBlocks.push(current);
                current = '';
            }
        }
        if (current) displayBlocks.push(current);
        
        // If we couldn't split nicely, just show all
        if (displayBlocks.length <= 1) {
            contentEl.innerHTML = html;
            isAnimating = false;
            return;
        }
        
        contentEl.innerHTML = '';
        var blockIndex = 0;
        var delayPerBlock = Math.max(50, speed * 3);
        
        function showNextBlock() {
            if (blockIndex >= displayBlocks.length || !isAnimating) {
                contentEl.innerHTML = html;
                isAnimating = false;
                return;
            }
            
            contentEl.innerHTML += displayBlocks[blockIndex];
            blockIndex++;
            typewriterTimeout = setTimeout(showNextBlock, delayPerBlock);
        }
        
        showNextBlock();
    }
    
    function toggleSlideAnimation(nodeIndex) {
        if (animationDisabledSlides[nodeIndex]) {
            delete animationDisabledSlides[nodeIndex];
        } else {
            animationDisabledSlides[nodeIndex] = true;
        }
        saveAnimationSettings();
        buildSidebar();
    }
    
    // Initialize animation system
    initAnimationSettings();

    // Initialize
    buildSidebar();
    if (nodes.length > 0) {
        showSlide(0);
    }
    showInitialTouchHint();
    initChecklistSidebar();
})();
</script>
